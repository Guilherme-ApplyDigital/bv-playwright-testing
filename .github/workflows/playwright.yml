name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BV_BASE_URL: https://develop--bv-ad.netlify.app
      BV_DEV_USER: ${{ secrets.BV_DEV_USER }}
      BV_DEV_PASSWORD: ${{ secrets.BV_DEV_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers (Chromium only)
      run: npx playwright install chromium --with-deps
    - name: Validate required secrets
      run: |
        if [ -z "${BV_DEV_USER}" ] || [ -z "${BV_DEV_PASSWORD}" ]; then
          echo "::error::Missing required secrets BV_DEV_USER and/or BV_DEV_PASSWORD."
          echo "::error::Configure them in Settings > Secrets and variables > Actions."
          exit 1
        fi
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload Playwright report to Pages artifact
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/

  deploy-report:
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
