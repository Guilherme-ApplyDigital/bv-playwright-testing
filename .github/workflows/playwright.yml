name: Playwright Tests
run-name: Playwright (${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'dev' }}) #${{ github.run_number }}
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 23:00 BRT (UTC-3) = 02:00 UTC (next day)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      target_env:
        description: Environment to run tests against
        type: choice
        required: true
        default: dev
        options:
          - dev
          - preview
          - stg
          - prod
      base_url_override:
        description: Optional full URL override (takes precedence over target_env)
        required: false
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      BV_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'dev' }}
      BV_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url_override || '' }}
      BV_DEV_USER: ${{ secrets.BV_DEV_USER }}
      BV_DEV_PASSWORD: ${{ secrets.BV_DEV_PASSWORD }}
    outputs:
      pages_ready: ${{ steps.pages_upload_marker.outputs.ok }}
    steps:
    - uses: actions/checkout@v6
    - name: Free disk space on runner
      run: |
        set -e
        sudo docker system prune -af 2>/dev/null || true
        sudo rm -rf \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/.ghcup \
          /usr/share/swift \
          /usr/local/share/boost \
          "$AGENT_TOOLSDIRECTORY/CodeQL" \
          /opt/microsoft/powershell \
          /usr/local/share/chromium \
          /usr/lib/google-cloud-sdk \
          2>/dev/null || true
        df -h
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        package-manager-cache: false
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers (Chromium only)
      run: npx playwright install chromium --with-deps
    - name: Print selected environment
      run: |
        echo "BV_ENV=${BV_ENV}"
        if [ -n "${BV_BASE_URL}" ]; then
          echo "BV_BASE_URL override=${BV_BASE_URL}"
        fi
    - name: Run Playwright tests
      id: playwright_tests
      continue-on-error: true
      run: npx playwright test --reporter=line,html,allure-playwright
    - name: Uninstall Playwright browsers (free disk for reports/artifacts)
      if: ${{ always() && !cancelled() }}
      run: npx playwright uninstall --all || true
    - name: Restore Allure history cache
      id: allure-cache-restore
      uses: actions/cache/restore@v5
      with:
        path: .allure-history-cache
        key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          allure-history-${{ github.ref_name }}-
    - name: Inject previous Allure history
      if: ${{ always() }}
      run: |
        if [ -d ".allure-history-cache/history" ]; then
          mkdir -p allure-results
          cp -R .allure-history-cache/history allure-results/history
        fi
    - name: Generate Allure report
      if: ${{ always() && !cancelled() }}
      run: npm run allure:generate
    - name: Pull report-history branch
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        rm -rf .pages-site
        if git clone --depth 1 --branch report-history "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .pages-site; then
          echo "report-history branch restored"
        else
          mkdir -p .pages-site
          cd .pages-site
          git init -b report-history
          touch .gitkeep
          git add .gitkeep
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Initialize report-history branch"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        fi
    - name: Update public report history site
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      env:
        PAGES_SITE_DIR: .pages-site
        SOURCE_REPORT_DIR: allure-report
      run: node ./scripts/update-pages-history-site.mjs
    - name: Commit and push report-history
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      run: |
        cd .pages-site
        git add .
        if git diff --cached --quiet; then
          echo "No report-history changes to push"
        else
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Report ${BV_ENV} run #${GITHUB_RUN_NUMBER}"
          git push origin HEAD:report-history
        fi
    - name: Prepare Pages artifact folder
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      run: |
        rm -rf .pages-artifact
        mkdir -p .pages-artifact
        cp -R .pages-site/. .pages-artifact/
        rm -rf .pages-artifact/.git
    - name: Pages artifact size (must stay under ~1GB for GitHub Pages)
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      run: du -sh .pages-artifact .pages-artifact/reports 2>/dev/null || true
    - name: Upload Allure report to Pages artifact
      id: upload_pages
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: .pages-artifact/
    - name: Record Pages artifact for deploy job
      id: pages_upload_marker
      if: ${{ steps.upload_pages.outcome == 'success' }}
      run: echo "ok=true" >> "$GITHUB_OUTPUT"
    - name: Remove local Pages tree after upload (free disk for other artifacts)
      if: ${{ success() && !cancelled() && github.ref == 'refs/heads/main' }}
      run: rm -rf .pages-site .pages-artifact
    - name: Update Allure history cache payload
      if: ${{ always() && !cancelled() }}
      run: |
        rm -rf .allure-history-cache
        mkdir -p .allure-history-cache
        cp -R allure-report/history .allure-history-cache/history
    - name: Save Allure history cache
      if: ${{ always() && !cancelled() }}
      uses: actions/cache/save@v5
      with:
        path: .allure-history-cache
        key: ${{ steps.allure-cache-restore.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v6
      if: ${{ always() && !cancelled() }}
      with:
        name: playwright-report-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: playwright-report/
        retention-days: 30
        compression-level: 6
    - uses: actions/upload-artifact@v6
      if: ${{ always() && !cancelled() }}
      with:
        name: allure-results-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: allure-results/
        retention-days: 30
        if-no-files-found: ignore
        compression-level: 6
    - uses: actions/upload-artifact@v6
      if: ${{ always() && !cancelled() }}
      with:
        name: allure-report-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: allure-report/
        retention-days: 30
        compression-level: 6
    - name: Prune bulky CI folders before summary
      if: ${{ always() && !cancelled() }}
      run: |
        rm -rf playwright-report/trace .git/modules 2>/dev/null || true
        du -sh . 2>/dev/null || true
    - name: Test summary
      if: ${{ always() }}
      run: |
        PASSED_COUNT=0
        TOTAL_COUNT=0
        PASS_RATE="0.0"
        SKIPPED_COUNT=0
        OTHER_COUNT=0

        if [ -f "allure-report/widgets/summary.json" ]; then
          METRICS=$(node -e "const fs=require('fs');const p='allure-report/widgets/summary.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));const s=d.statistic||{};const passed=Number(s.passed||0);const total=Number(s.total||0);const skipped=Number(s.skipped||0);const other=Number(s.failed||0)+Number(s.broken||0)+Number(s.unknown||0);const rate=total?((passed/total)*100).toFixed(1):'0.0';console.log([passed,total,rate,skipped,other].join(','));")
          IFS=',' read -r PASSED_COUNT TOTAL_COUNT PASS_RATE SKIPPED_COUNT OTHER_COUNT <<< "$METRICS"
        fi

        echo "========== TEST SUMMARY =========="
        echo "Environment: ${BV_ENV}"
        echo "Passed: ${PASSED_COUNT}/${TOTAL_COUNT} (${PASS_RATE}%)"
        echo "Skipped: ${SKIPPED_COUNT}"
        echo "Other results (failed/broken/unknown): ${OTHER_COUNT}"
        echo "Artifacts:"
        echo "- playwright-report-${BV_ENV}-run-${GITHUB_RUN_NUMBER}"
        echo "- allure-results-${BV_ENV}-run-${GITHUB_RUN_NUMBER}"
        echo "- allure-report-${BV_ENV}-run-${GITHUB_RUN_NUMBER}"
        echo "=================================="
        {
          echo "## ✅ Test Summary"
          echo ""
          echo "- Environment: \`${BV_ENV}\`"
          echo "- Passed: \`${PASSED_COUNT}/${TOTAL_COUNT}\` (\`${PASS_RATE}%\`)"
          echo "- Skipped: \`${SKIPPED_COUNT}\`"
          echo "- Other results (failed/broken/unknown): \`${OTHER_COUNT}\`"
          echo "- Artifacts:"
          echo "  - \`playwright-report-${BV_ENV}-run-${GITHUB_RUN_NUMBER}\`"
          echo "  - \`allure-results-${BV_ENV}-run-${GITHUB_RUN_NUMBER}\`"
          echo "  - \`allure-report-${BV_ENV}-run-${GITHUB_RUN_NUMBER}\`"
        } >> "$GITHUB_STEP_SUMMARY"

  deploy-report:
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      needs.test.outputs.pages_ready == 'true'
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
