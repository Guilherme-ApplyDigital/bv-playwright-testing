name: Playwright Tests
run-name: Playwright (${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'dev' }}) #${{ github.run_number }}
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_env:
        description: Environment to run tests against
        type: choice
        required: true
        default: dev
        options:
          - dev
          - preview
          - stg
          - prod
      base_url_override:
        description: Optional full URL override (takes precedence over target_env)
        required: false
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BV_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'dev' }}
      BV_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url_override || '' }}
      BV_DEV_USER: ${{ secrets.BV_DEV_USER }}
      BV_DEV_PASSWORD: ${{ secrets.BV_DEV_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers (Chromium only)
      run: npx playwright install chromium --with-deps
    - name: Print selected environment
      run: |
        echo "BV_ENV=${BV_ENV}"
        if [ -n "${BV_BASE_URL}" ]; then
          echo "BV_BASE_URL override=${BV_BASE_URL}"
        fi
    - name: Run Playwright tests
      run: npx playwright test --reporter=line,html,allure-playwright
    - name: Restore Allure history cache
      id: allure-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: .allure-history-cache
        key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          allure-history-${{ github.ref_name }}-
    - name: Inject previous Allure history
      if: ${{ always() }}
      run: |
        if [ -d ".allure-history-cache/history" ]; then
          mkdir -p allure-results
          cp -R .allure-history-cache/history allure-results/history
        fi
    - name: Generate Allure report
      if: ${{ always() && !cancelled() }}
      run: npm run allure:generate
    - name: Pull report-history branch
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        rm -rf .pages-site
        if git clone --depth 1 --branch report-history "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .pages-site; then
          echo "report-history branch restored"
        else
          mkdir -p .pages-site
          cd .pages-site
          git init -b report-history
          touch .gitkeep
          git add .gitkeep
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Initialize report-history branch"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        fi
    - name: Update public report history site
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      env:
        PAGES_SITE_DIR: .pages-site
        SOURCE_REPORT_DIR: allure-report
      run: node ./scripts/update-pages-history-site.mjs
    - name: Commit and push report-history
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      run: |
        cd .pages-site
        git add .
        if git diff --cached --quiet; then
          echo "No report-history changes to push"
        else
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Report ${BV_ENV} run #${GITHUB_RUN_NUMBER}"
          git push origin HEAD:report-history
        fi
    - name: Prepare Pages artifact folder
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      run: |
        rm -rf .pages-artifact
        mkdir -p .pages-artifact
        cp -R .pages-site/. .pages-artifact/
        rm -rf .pages-artifact/.git
    - name: Update Allure history cache payload
      if: ${{ always() && !cancelled() }}
      run: |
        rm -rf .allure-history-cache
        mkdir -p .allure-history-cache
        cp -R allure-report/history .allure-history-cache/history
    - name: Save Allure history cache
      if: ${{ always() && !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: .allure-history-cache
        key: ${{ steps.allure-cache-restore.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: playwright-report-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: playwright-report/
        retention-days: 90
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: allure-results-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: allure-results/
        retention-days: 90
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: allure-report-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: allure-report/
        retention-days: 90
    - name: Upload Allure report to Pages artifact
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: .pages-artifact/

  deploy-report:
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
