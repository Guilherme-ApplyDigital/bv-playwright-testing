name: Playwright Tests
run-name: Playwright (${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'dev' }}) #${{ github.run_number }}
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      target_env:
        description: Environment to run tests against
        type: choice
        required: true
        default: dev
        options:
          - dev
          - stg
          - prod
      base_url_override:
        description: Optional full URL override (takes precedence over target_env)
        required: false
        type: string

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BV_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_env || 'dev' }}
      BV_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url_override || '' }}
      BV_DEV_USER: ${{ secrets.BV_DEV_USER }}
      BV_DEV_PASSWORD: ${{ secrets.BV_DEV_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers (Chromium only)
      run: npx playwright install chromium --with-deps
    - name: Print selected environment
      run: |
        echo "BV_ENV=${BV_ENV}"
        if [ -n "${BV_BASE_URL}" ]; then
          echo "BV_BASE_URL override=${BV_BASE_URL}"
        fi
    - name: Run Playwright tests
      run: npx playwright test --reporter=line,html,allure-playwright
    - name: Restore Allure history cache
      id: allure-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: .allure-history-cache
        key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          allure-history-${{ github.ref_name }}-
    - name: Inject previous Allure history
      if: ${{ always() }}
      run: |
        if [ -d ".allure-history-cache/history" ]; then
          mkdir -p allure-results
          cp -R .allure-history-cache/history allure-results/history
        fi
    - name: Generate Allure report
      if: ${{ always() && !cancelled() }}
      run: npm run allure:generate
    - name: Restore historical Pages snapshot
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p .pages-site
        ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="pages-site-backup" and .expired==false) | .id' | head -n 1 || true)"
        if [ -n "${ARTIFACT_ID}" ]; then
          echo "Restoring pages-site-backup artifact id=${ARTIFACT_ID}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > pages-site-backup.zip
          unzip -q -o pages-site-backup.zip -d .pages-site
        else
          echo "No previous pages-site-backup found; starting fresh."
        fi
    - name: Update historical Pages content
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      run: |
        set -euo pipefail
        RUN_STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)-run-${GITHUB_RUN_NUMBER}"
        TARGET_DIR=".pages-site/reports/${BV_ENV}/${RUN_STAMP}"
        LATEST_DIR=".pages-site/reports/${BV_ENV}/latest"

        mkdir -p "${TARGET_DIR}" "${LATEST_DIR}"
        rm -rf "${TARGET_DIR:?}/"* "${LATEST_DIR:?}/"* || true
        cp -R allure-report/. "${TARGET_DIR}/"
        cp -R allure-report/. "${LATEST_DIR}/"
        node ./scripts/build-pages-portal.mjs
    - name: Update Allure history cache payload
      if: ${{ always() && !cancelled() }}
      run: |
        rm -rf .allure-history-cache
        mkdir -p .allure-history-cache
        cp -R allure-report/history .allure-history-cache/history
    - name: Save Allure history cache
      if: ${{ always() && !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: .allure-history-cache
        key: ${{ steps.allure-cache-restore.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: playwright-report-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: playwright-report/
        retention-days: 90
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: allure-results-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: allure-results/
        retention-days: 90
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: allure-report-${{ env.BV_ENV }}-run-${{ github.run_number }}
        path: allure-report/
        retention-days: 90
    - name: Upload Allure report to Pages artifact
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: .pages-site/
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      with:
        name: pages-site-backup
        path: .pages-site/
        retention-days: 90
        overwrite: true

  deploy-report:
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
