name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BV_BASE_URL: https://develop--bv-ad.netlify.app
      BV_DEV_USER: ${{ secrets.BV_DEV_USER }}
      BV_DEV_PASSWORD: ${{ secrets.BV_DEV_PASSWORD }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers (Chromium only)
      run: npx playwright install chromium --with-deps
    - name: Validate required secrets
      run: |
        if [ -z "${BV_DEV_USER}" ] || [ -z "${BV_DEV_PASSWORD}" ]; then
          echo "::error::Missing required secrets BV_DEV_USER and/or BV_DEV_PASSWORD."
          echo "::error::Configure them in Settings > Secrets and variables > Actions."
          exit 1
        fi
    - name: Run Playwright tests
      run: npx playwright test --reporter=line,html,allure-playwright
    - name: Restore Allure history cache
      id: allure-cache-restore
      uses: actions/cache/restore@v4
      with:
        path: .allure-history-cache
        key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          allure-history-${{ github.ref_name }}-
    - name: Inject previous Allure history
      if: ${{ always() }}
      run: |
        if [ -d ".allure-history-cache/history" ]; then
          mkdir -p allure-results
          cp -R .allure-history-cache/history allure-results/history
        fi
    - name: Generate Allure report
      if: ${{ always() && !cancelled() }}
      run: npx allure generate allure-results --clean -o allure-report
    - name: Update Allure history cache payload
      if: ${{ always() && !cancelled() }}
      run: |
        rm -rf .allure-history-cache
        mkdir -p .allure-history-cache
        cp -R allure-report/history .allure-history-cache/history
    - name: Save Allure history cache
      if: ${{ always() && !cancelled() }}
      uses: actions/cache/save@v4
      with:
        path: .allure-history-cache
        key: ${{ steps.allure-cache-restore.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ always() && !cancelled() }}
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
    - name: Upload Allure report to Pages artifact
      if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report/

  deploy-report:
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
